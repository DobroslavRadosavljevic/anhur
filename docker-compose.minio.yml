# Local-only MinIO for Anhur assets storage development.
# Throwaway credentials — do not reuse in production.
services:
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: anhur
      MINIO_ROOT_PASSWORD: anhursecret
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 anhur anhursecret;
      mc mb --ignore-existing local/anhur-assets;
      mc anonymous set download local/anhur-assets;
      exit 0;
      "

volumes:
  minio-data:
